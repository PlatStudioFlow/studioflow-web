<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — StudioFlow</title>
<link rel="icon" href="assets/logo-small.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E1F">
</head>
<body class="app">
<script type="module" src="js/mobile-nav.js?v=1"></script>
<script type="module" src="js/search.js?v=1"></script>

<div class="app-layout">
  <aside class="sidebar">
    <div class="mark"><img src="assets/logo.png" alt="StudioFlow" class="icon"><div class="wordmark">Studio<span>Flow</span></div></div>
    <div class="tagline">Painel administrativo</div>
    <nav>
      <a href="admin.html" class="nav-item active">Estúdios (clientes)</a>
    </nav>
    <div class="logout">
      <a href="dashboard.html" class="nav-item">Ir para meu estúdio</a>
      <a href="#" class="nav-item" id="btn-logout">Sair</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 style="font-size:26px;font-weight:800;text-transform:uppercase;margin:0;">Estúdios cadastrados</h1>
        <p style="font-size:13.5px;color:var(--ink-soft);margin:4px 0 0;">Ative, dê período de teste, bloqueie ou exclua o acesso de cada cliente da plataforma.</p>
      </div>
    </div>

    <input type="text" class="admin-search" id="busca" placeholder="Buscar por nome ou e-mail...">

    <div id="area-lista"><div class="empty-state">Carregando...</div></div>
  </main>
</div>

<script type="module">
  import { supabase } from './js/supabase-client.js?v=5';
  import { ensureProfileAndTenant } from './js/auth.js?v=6';

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) window.location.href = 'login.html';

  let meuProfile;
  try {
    meuProfile = await ensureProfileAndTenant(session.user);
  } catch (err) {
    console.error(err);
    window.location.href = 'login.html';
  }

  if (meuProfile.role !== 'admin_studioflow') {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('btn-logout').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
  function fmtDataCurta(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  let tenantsCache = [];

  async function carregarTenants() {
    const { data: tenants, error } = await supabase
      .from('tenants')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      document.getElementById('area-lista').innerHTML = `<div class="empty-state">Não foi possível carregar. Confirme se sua conta tem permissão de admin.</div>`;
      return;
    }
    tenantsCache = tenants || [];
    renderLista(tenantsCache);
  }

  function statusLabel(t) {
    if (t.status === 'trial') {
      const hojeISO = new Date().toISOString().slice(0, 10);
      const expirado = !t.trial_ends_at || t.trial_ends_at < hojeISO;
      return expirado ? 'trial expirado' : `trial até ${fmtDataCurta(t.trial_ends_at)}`;
    }
    return t.status;
  }

  function renderLista(lista) {
    const area = document.getElementById('area-lista');
    if (!lista.length) {
      area.innerHTML = `<div class="empty-state">Nenhum estúdio encontrado.</div>`;
      return;
    }

    area.innerHTML = `<div class="list-card">${lista.map(t => `
      <div class="admin-row" data-id="${t.id}">
        <div class="info">
          <div class="nome">${escapeHtml(t.business_name || '(sem nome)')} <span class="status-tag ${t.status}">${statusLabel(t)}</span></div>
          <div class="email">${escapeHtml(t.contact_email || '—')}${t.contact_phone ? ' · ' + escapeHtml(t.contact_phone) : ''}</div>
          <div class="criado">cadastrado em ${fmtDataCurta((t.created_at || '').slice(0, 10))}</div>
        </div>
        <div class="admin-actions">
          ${t.status === 'pendente' ? `
            <input type="number" min="1" value="10" class="input-trial" title="dias de teste">
            <button class="a-trial" data-action="trial">Iniciar teste</button>
            <button class="a-ativar" data-action="ativar">Ativar definitivo</button>
          ` : ''}
          ${t.status === 'trial' ? `
            <button class="a-ativar" data-action="ativar">Converter em definitivo</button>
            <button class="a-bloquear" data-action="bloquear">Bloquear</button>
          ` : ''}
          ${t.status === 'ativo' ? `
            <button class="a-bloquear" data-action="bloquear">Bloquear</button>
          ` : ''}
          ${t.status === 'bloqueado' ? `
            <button class="a-reativar" data-action="ativar">Reativar</button>
          ` : ''}
          <button class="a-excluir" data-action="excluir">Excluir</button>
        </div>
      </div>
    `).join('')}</div>`;

    area.querySelectorAll('.admin-row').forEach(row => {
      const id = row.dataset.id;

      row.querySelectorAll('[data-action="ativar"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          const { data: sessionData } = await supabase.auth.getSession();
          const accessToken = sessionData?.session?.access_token;

          const { error } = await supabase.functions.invoke('ativar-manual', {
            body: { tenant_id: id },
            headers: { Authorization: `Bearer ${accessToken}` },
          });

          if (error) {
            console.error(error);
            alert('Não foi possível ativar.');
            btn.disabled = false;
            return;
          }
          carregarTenants();
        });
      });

      row.querySelectorAll('[data-action="trial"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const dias = parseInt(row.querySelector('.input-trial').value, 10) || 10;
          const data = new Date();
          data.setDate(data.getDate() + dias);
          await supabase.from('tenants').update({ status: 'trial', trial_ends_at: data.toISOString().slice(0, 10) }).eq('id', id);
          carregarTenants();
        });
      });

      row.querySelectorAll('[data-action="bloquear"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          await supabase.from('tenants').update({ status: 'bloqueado' }).eq('id', id);
          carregarTenants();
        });
      });

      row.querySelectorAll('[data-action="excluir"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const t = tenantsCache.find(x => x.id === id);
          if (!confirm(`Excluir "${t.business_name}" e TODOS os dados dele (clientes, orçamentos, financeiro etc)? Essa ação não pode ser desfeita.`)) return;

          btn.disabled = true;
          btn.textContent = 'Excluindo...';

          const { data: sessionData } = await supabase.auth.getSession();
          const accessToken = sessionData?.session?.access_token;

          const { data, error } = await supabase.functions.invoke('excluir-usuario', {
            body: { tenant_id: id },
            headers: { Authorization: `Bearer ${accessToken}` },
          });

          if (error) {
            console.error(error);
            alert('Não foi possível excluir.');
            btn.disabled = false;
            btn.textContent = 'Excluir';
            return;
          }

          if (data?.warning) {
            console.warn(data.warning, data.falharam);
            alert('Estúdio excluído, mas houve um problema ao remover o login de acesso. Verifique os logs.');
          }

          carregarTenants();
        });
      });
    });
  }

  document.getElementById('busca').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { renderLista(tenantsCache); return; }
    renderLista(tenantsCache.filter(t =>
      (t.business_name || '').toLowerCase().includes(q) ||
      (t.contact_email || '').toLowerCase().includes(q)
    ));
  });

  carregarTenants();
</script>
</body>
</html>
