<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — StudioFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo-small.png">
<link rel="stylesheet" href="css/style.css?v=5">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E1F">
</head>
<body>

<div class="frame">
  <div class="mark">
    <img src="assets/logo.png" alt="StudioFlow" class="icon">
    <div class="wordmark">Studio<span>Flow</span></div>
  </div>

  <div class="card">
    <h1>Redefinir senha</h1>
    <p class="lead" id="lead-texto">Escolha uma nova senha para sua conta.</p>

    <form id="form-redefinir">
      <div class="field">
        <label for="nova-senha">Nova senha</label>
        <input type="password" id="nova-senha" required minlength="6" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="field">
        <label for="confirmar-senha">Confirmar nova senha</label>
        <input type="password" id="confirmar-senha" required minlength="6" placeholder="Repita a nova senha">
      </div>
      <button type="submit" id="btn-submit">Salvar nova senha</button>
      <div class="status-msg" id="status"></div>
    </form>

    <div class="switch"><a href="login.html">← Voltar para o login</a></div>
  </div>
</div>

<script type="module">
  import { supabase } from './js/supabase-client.js?v=5';

  const form = document.getElementById('form-redefinir');
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('btn-submit');
  const leadEl = document.getElementById('lead-texto');

  // O link do e-mail estabelece uma sessão temporária de recuperação.
  // Se a pessoa abrir esta página sem vir desse link, avisamos e
  // bloqueamos o formulário.
  let sessaoValida = false;

  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      sessaoValida = true;
    }
  });

  const { data: { session } } = await supabase.auth.getSession();
  if (session) sessaoValida = true;

  if (!sessaoValida) {
    leadEl.textContent = 'Este link é inválido ou expirou. Solicite um novo link de redefinição na tela de login.';
    form.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    statusEl.className = 'status-msg';
    statusEl.textContent = '';

    const novaSenha = document.getElementById('nova-senha').value;
    const confirmarSenha = document.getElementById('confirmar-senha').value;

    if (novaSenha !== confirmarSenha) {
      statusEl.className = 'status-msg status-erro';
      statusEl.textContent = 'As senhas não coincidem.';
      btn.disabled = false;
      return;
    }

    const { error } = await supabase.auth.updateUser({ password: novaSenha });

    if (error) {
      statusEl.className = 'status-msg status-erro';
      statusEl.textContent = 'Não foi possível salvar a nova senha. Tente novamente.';
      btn.disabled = false;
      return;
    }

    statusEl.className = 'status-msg status-ok';
    statusEl.textContent = 'Senha alterada com sucesso! Redirecionando para o login...';
    await supabase.auth.signOut();
    setTimeout(() => { window.location.href = 'login.html'; }, 1800);
  });
</script>

</body>
</html>
